name: Set age rating declaration

# Fills in Apple's expanded age-rating questionnaire, which deliver cannot
# supply and which blocks every submit lane. Answers are NONE/false across the
# board because these apps are offline and local-only. Manual trigger.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/eggcelence
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/eggcelence/ios/App

      - name: Set age rating declaration
        working-directory: apps/eggcelence/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane ios set_age_rating
