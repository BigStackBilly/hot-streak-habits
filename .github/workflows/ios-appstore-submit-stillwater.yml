name: App Store Submit (Stillwater)

# Manual trigger only. Pushes App Store listing metadata/screenshots and
# submits the most recent TestFlight build for review — run this only
# after a `iOS TestFlight (Stillwater)` run has succeeded and Apple has
# finished processing that build (usually a few minutes to an hour).
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/stillwater
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Sync Capacitor web assets into the native project
        run: npm run sync

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/stillwater/ios/App

      - name: Push metadata/screenshots and submit for review
        working-directory: apps/stillwater/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane release
