name: Android Release (Daily Line)

# Manual trigger only — same reasoning as the iOS workflows: uploading a
# real build to Play Console isn't something to fire off on every push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/daily-line
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Sync Capacitor web assets into the native project
        run: npm run sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A Play Store app must be signed with the SAME key for every future
      # update, so this keystore has to survive across runs rather than
      # being regenerated each time (same idea as the iOS "Cache CI
      # keychain" step). Static cache key on purpose — always restore the
      # one true keystore, never start fresh once it exists.
      - name: Cache upload keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: apps/daily-line/android/upload-keystore.jks
          key: android-upload-keystore-dailyline-v1

      - name: Generate upload keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        working-directory: apps/daily-line/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore upload-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "CN=Daily Line, OU=Niloc, O=Niloc, L=NA, ST=NA, C=US"

      - name: Build signed release AAB
        working-directory: apps/daily-line/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=upload-keystore.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # Requires a Play Console service account JSON (Play Console > Setup
      # > API access > create service account, grant it access to this
      # app) stored as the PLAY_SERVICE_ACCOUNT_JSON secret. Also requires
      # the app to already exist as a shell listing in Play Console —
      # unlike Apple's `produce`, the Play Developer API cannot create a
      # brand-new app listing from scratch, so that one-time step has to
      # happen in the Play Console UI first.
      - name: Upload to Play Console (internal testing track)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Run fastlane supply
        working-directory: apps/daily-line/android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          gem install fastlane
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          fastlane supply \
            --package_name com.Niloc.dailyline \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --json_key play-service-account.json \
            --track internal
