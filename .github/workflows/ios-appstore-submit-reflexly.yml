name: App Store Submit (Reflexly)

# Manual trigger only. Pushes App Store listing metadata/screenshots and
# submits the most recent TestFlight build for review — run this only
# after a `iOS TestFlight (Reflexly)` run has succeeded and Apple has
# finished processing that build.
on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    # Fail fast instead of hanging: if no processed TestFlight build exists,
    # `deliver` polls "Waiting for the build to show up" until GitHub kills
    # the job at its 6-hour ceiling. 40 minutes is ample for a real run.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/reflexly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install

      - name: Sync Capacitor web assets into the native project
        run: npm run sync

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/reflexly/ios/App

      - name: Push metadata/screenshots and submit for review
        working-directory: apps/reflexly/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane release
