<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

<meta name="theme-color" content="#3ad1c4" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
// =====================================================================
// REFLEXLY — a four-stage reflex gauntlet, once a day
//
// Same conventions as the sibling apps: local-first, zero login, zero
// backend, inline Babel so it runs straight from a file:// URL.
//
// The daily run is four fixed stages, each worth up to 250 points:
//   1. React    - tap the moment the panel turns live (3 attempts)
//   2. Targets  - pop 12 targets as fast as you can
//   3. Sequence - watch a flash pattern, repeat it, it grows
//   4. Match    - the word vs. its ink colour, 20 seconds
//
// Everyone gets the same target positions, sequences and word order on a
// given day because all randomness is seeded from the local date.
// =====================================================================

const { useState, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------
// Seeded randomness
// ---------------------------------------------------------------------
function hashString(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

const EPOCH = new Date(2026, 0, 1);
function puzzleNumber(key) {
  const [y, m, d] = key.split("-").map(Number);
  return Math.max(1, Math.round((new Date(y, m - 1, d) - EPOCH) / 86400000) + 1);
}

const MAX_STAGE = 250;
const MAX_SCORE = MAX_STAGE * 4;
const TARGET_COUNT = 12;
const MATCH_SECONDS = 20;

const clampScore = (n) => Math.max(0, Math.min(MAX_STAGE, Math.round(n)));

// ---------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------
const K = {
  stats: "reflexly:stats",
  daily: "reflexly:daily",
  theme: "reflexly:theme",
  pro: "reflexly:pro",
  palette: "reflexly:palette",
  owned: "reflexly:owned",
};

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}

function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* non-fatal */ }
}

const EMPTY_STATS = {
  played: 0, totalScore: 0, bestScore: 0, bestReaction: null,
  streak: 0, maxStreak: 0, lastPlayed: null, history: [],
};

function recordResult(stats, key, score, bestReaction) {
  const next = { ...stats };
  next.played += 1;
  next.totalScore += score;
  next.bestScore = Math.max(next.bestScore, score);
  if (bestReaction != null) {
    next.bestReaction = next.bestReaction == null ? bestReaction : Math.min(next.bestReaction, bestReaction);
  }
  const yesterday = dateKey(new Date(Date.now() - 86400000));
  if (next.lastPlayed === yesterday) next.streak += 1;
  else if (next.lastPlayed === key) { /* replay, streak unchanged */ }
  else next.streak = 1;
  next.maxStreak = Math.max(next.maxStreak, next.streak);
  next.lastPlayed = key;
  next.history = [...next.history, { date: key, score }].slice(-60);
  return next;
}

const PALETTES = [
  { id: "neon", name: "Neon", free: true, accent: "#3ad1c4", accent2: "#3a86e0" },
  { id: "ember", name: "Ember", free: false, accent: "#ff8a3d", accent2: "#e2455f" },
  { id: "violet", name: "Violet", free: false, accent: "#a06cf0", accent2: "#5b5be0" },
  { id: "lime", name: "Lime", free: false, accent: "#9bd83a", accent2: "#2fb87a" },
];

// =====================================================================
// STAGE 1 — REACT
// Three attempts; the panel goes live after a seeded random delay.
// =====================================================================
function StageReact({ rand, onDone }) {
  const [phase, setPhase] = useState("idle"); // idle | waiting | live | early | done
  const [times, setTimes] = useState([]);
  const [last, setLast] = useState(null);
  const liveAtRef = useRef(0);
  const timeoutRef = useRef(null);
  const phaseRef = useRef("idle");

  const setPhaseSafe = (p) => { phaseRef.current = p; setPhase(p); };

  const arm = useCallback(() => {
    setPhaseSafe("waiting");
    const delay = 1200 + rand() * 2600;
    timeoutRef.current = setTimeout(() => {
      liveAtRef.current = Date.now();
      setPhaseSafe("live");
    }, delay);
  }, [rand]);

  useEffect(() => () => clearTimeout(timeoutRef.current), []);

  const tap = () => {
    const p = phaseRef.current;
    if (p === "idle") { arm(); return; }
    if (p === "waiting") {
      // Jumped the gun — cancel the pending flip and make them retry.
      clearTimeout(timeoutRef.current);
      setPhaseSafe("early");
      return;
    }
    if (p === "early") { arm(); return; }
    if (p === "live") {
      const ms = Date.now() - liveAtRef.current;
      const nextTimes = [...times, ms];
      setTimes(nextTimes);
      setLast(ms);
      if (nextTimes.length >= 3) {
        const avg = nextTimes.reduce((a, b) => a + b, 0) / nextTimes.length;
        setPhaseSafe("done");
        setTimeout(() => onDone(clampScore((MAX_STAGE * (500 - avg)) / 350), { avg: Math.round(avg), best: Math.min(...nextTimes) }), 900);
      } else {
        setPhaseSafe("idle");
      }
    }
  };

  const copy = {
    idle: times.length ? "Tap to arm the next one" : "Tap to start",
    waiting: "Wait for it…",
    live: "TAP!",
    early: "Too early — tap to retry",
    done: "Nice.",
  }[phase];

  return (
    <div className="stage">
      <div className="stage-head">
        <div className="stage-name">React</div>
        <div className="stage-hint">Tap the instant the panel lights up</div>
      </div>
      <button className={`react-panel react-${phase}`} onClick={tap}>
        <span className="react-copy">{copy}</span>
        {last != null && phase !== "live" && <span className="react-ms">{last} ms</span>}
      </button>
      <div className="attempt-row">
        {[0, 1, 2].map((i) => (
          <div key={i} className={"attempt" + (times[i] != null ? " filled" : "")}>
            {times[i] != null ? `${times[i]}` : "—"}
          </div>
        ))}
      </div>
    </div>
  );
}

// =====================================================================
// STAGE 2 — TARGETS
// Twelve targets at seeded positions; scored on total elapsed time.
// =====================================================================
function StageTargets({ rand, onDone }) {
  const [started, setStarted] = useState(false);
  const [hit, setHit] = useState(0);
  const [pos, setPos] = useState({ x: 50, y: 50 });
  const [elapsed, setElapsed] = useState(0);
  const startRef = useRef(0);
  const hitRef = useRef(0);

  const nextPos = useCallback(() => {
    setPos({ x: 12 + rand() * 76, y: 12 + rand() * 76 });
  }, [rand]);

  useEffect(() => {
    if (!started) return;
    const t = setInterval(() => setElapsed(Date.now() - startRef.current), 60);
    return () => clearInterval(t);
  }, [started]);

  const begin = () => {
    startRef.current = Date.now();
    hitRef.current = 0;
    setHit(0);
    setStarted(true);
    nextPos();
  };

  const tapTarget = (e) => {
    e.stopPropagation();
    const n = hitRef.current + 1;
    hitRef.current = n;
    setHit(n);
    if (n >= TARGET_COUNT) {
      const total = Date.now() - startRef.current;
      onDone(clampScore((MAX_STAGE * (12000 - total)) / 9000), { ms: total });
    } else {
      nextPos();
    }
  };

  return (
    <div className="stage">
      <div className="stage-head">
        <div className="stage-name">Targets</div>
        <div className="stage-hint">Pop {TARGET_COUNT} targets as fast as you can</div>
      </div>
      <div className="field">
        {!started ? (
          <button className="field-start" onClick={begin}>Tap to start</button>
        ) : (
          <button
            className="target"
            style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
            onClick={tapTarget}
            aria-label={`Target ${hit + 1}`}
          />
        )}
      </div>
      <div className="field-meta">
        <span>{hit}/{TARGET_COUNT}</span>
        <span>{(elapsed / 1000).toFixed(1)}s</span>
      </div>
    </div>
  );
}

// =====================================================================
// STAGE 3 — SEQUENCE
// Simon-style: a seeded flash pattern that grows by one each round.
// =====================================================================
const PADS = [0, 1, 2, 3];

function StageSequence({ rand, onDone }) {
  const [sequence, setSequence] = useState([]);
  const [flash, setFlash] = useState(null);
  const [phase, setPhase] = useState("idle"); // idle | showing | input | fail
  const [level, setLevel] = useState(0);
  const inputIndexRef = useRef(0);
  const phaseRef = useRef("idle");
  const timersRef = useRef([]);

  const setPhaseSafe = (p) => { phaseRef.current = p; setPhase(p); };

  useEffect(() => () => timersRef.current.forEach(clearTimeout), []);

  const playSequence = useCallback((seq) => {
    setPhaseSafe("showing");
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
    seq.forEach((pad, i) => {
      timersRef.current.push(setTimeout(() => setFlash(pad), i * 620 + 260));
      timersRef.current.push(setTimeout(() => setFlash(null), i * 620 + 620));
    });
    timersRef.current.push(
      setTimeout(() => {
        inputIndexRef.current = 0;
        setPhaseSafe("input");
      }, seq.length * 620 + 300)
    );
  }, []);

  const advance = useCallback(() => {
    const next = [...sequence, PADS[Math.floor(rand() * 4)]];
    setSequence(next);
    setLevel(next.length);
    playSequence(next);
  }, [sequence, rand, playSequence]);

  const start = () => {
    const first = [PADS[Math.floor(rand() * 4)], PADS[Math.floor(rand() * 4)], PADS[Math.floor(rand() * 4)]];
    setSequence(first);
    setLevel(3);
    playSequence(first);
  };

  const tapPad = (pad) => {
    if (phaseRef.current !== "input") return;
    setFlash(pad);
    setTimeout(() => setFlash(null), 160);

    if (sequence[inputIndexRef.current] !== pad) {
      setPhaseSafe("fail");
      // Sequences start at length 3, so missing the very first one means
      // nothing was cleared — only lengths above 3 credit a completed round.
      const cleared = sequence.length > 3 ? sequence.length - 1 : 0;
      setTimeout(() => onDone(clampScore((cleared - 2) * 35), { level: cleared }), 900);
      return;
    }

    inputIndexRef.current += 1;
    if (inputIndexRef.current >= sequence.length) {
      if (sequence.length >= 9) {
        setPhaseSafe("idle");
        setTimeout(() => onDone(MAX_STAGE, { level: sequence.length }), 700);
        return;
      }
      setPhaseSafe("showing");
      setTimeout(advance, 700);
    }
  };

  const banner = {
    idle: sequence.length ? "Nice!" : "Tap start, then repeat the pattern",
    showing: "Watch…",
    input: "Your turn",
    fail: "Missed it",
  }[phase];

  return (
    <div className="stage">
      <div className="stage-head">
        <div className="stage-name">Sequence</div>
        <div className="stage-hint">{banner}</div>
      </div>
      <div className="pads">
        {PADS.map((p) => (
          <button
            key={p}
            className={`pad pad-${p}` + (flash === p ? " lit" : "")}
            onClick={() => tapPad(p)}
            aria-label={`Pad ${p + 1}`}
          />
        ))}
      </div>
      {sequence.length === 0 ? (
        <button className="btn btn-primary" onClick={start}>Start</button>
      ) : (
        <div className="field-meta"><span>Length {level}</span><span>Best possible 9</span></div>
      )}
    </div>
  );
}

// =====================================================================
// STAGE 4 — MATCH
// A colour word printed in a colour. Does the word match the ink?
// =====================================================================
const INK = [
  { name: "RED", hex: "#e2455f" },
  { name: "BLUE", hex: "#3a86e0" },
  { name: "GREEN", hex: "#2fb87a" },
  { name: "GOLD", hex: "#e0a72f" },
];

function StageMatch({ rand, onDone }) {
  const [started, setStarted] = useState(false);
  const [item, setItem] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [wrong, setWrong] = useState(0);
  const [left, setLeft] = useState(MATCH_SECONDS);
  const [pulse, setPulse] = useState(null);
  const scoreRef = useRef({ correct: 0, wrong: 0 });
  const endRef = useRef(0);
  const doneRef = useRef(false);

  const roll = useCallback(() => {
    const wordIdx = Math.floor(rand() * 4);
    // Bias toward matching about half the time so it stays a real judgement.
    const isMatch = rand() < 0.5;
    const inkIdx = isMatch ? wordIdx : (wordIdx + 1 + Math.floor(rand() * 3)) % 4;
    setItem({ word: INK[wordIdx].name, ink: INK[inkIdx].hex, match: wordIdx === inkIdx });
  }, [rand]);

  const begin = () => {
    endRef.current = Date.now() + MATCH_SECONDS * 1000;
    doneRef.current = false;
    scoreRef.current = { correct: 0, wrong: 0 };
    setStarted(true);
    roll();
  };

  useEffect(() => {
    if (!started) return;
    const t = setInterval(() => {
      const remaining = Math.max(0, endRef.current - Date.now());
      setLeft(Math.ceil(remaining / 1000));
      if (remaining <= 0 && !doneRef.current) {
        doneRef.current = true;
        clearInterval(t);
        const { correct: c, wrong: w } = scoreRef.current;
        onDone(clampScore((c - w) * 15), { correct: c, wrong: w });
      }
    }, 100);
    return () => clearInterval(t);
  }, [started, onDone]);

  const answer = (said) => {
    if (!started || doneRef.current || !item) return;
    const right = said === item.match;
    if (right) {
      scoreRef.current.correct += 1;
      setCorrect(scoreRef.current.correct);
    } else {
      scoreRef.current.wrong += 1;
      setWrong(scoreRef.current.wrong);
    }
    setPulse(right ? "ok" : "no");
    setTimeout(() => setPulse(null), 180);
    roll();
  };

  return (
    <div className="stage">
      <div className="stage-head">
        <div className="stage-name">Match</div>
        <div className="stage-hint">Does the word match the colour it's printed in?</div>
      </div>

      {!started ? (
        <div className="field">
          <button className="field-start" onClick={begin}>Tap to start</button>
        </div>
      ) : (
        <>
          <div className={"word-box" + (pulse ? ` pulse-${pulse}` : "")}>
            <span className="stroop" style={{ color: item ? item.ink : undefined }}>
              {item ? item.word : ""}
            </span>
          </div>
          <div className="yn-row">
            <button className="btn btn-no" onClick={() => answer(false)}>No</button>
            <button className="btn btn-yes" onClick={() => answer(true)}>Yes</button>
          </div>
          <div className="field-meta">
            <span>✓ {correct} · ✕ {wrong}</span>
            <span>{left}s</span>
          </div>
        </>
      )}
    </div>
  );
}

// =====================================================================
// Views
// =====================================================================
const STAGES = [
  { key: "react", label: "React" },
  { key: "targets", label: "Targets" },
  { key: "sequence", label: "Sequence" },
  { key: "match", label: "Match" },
];

function HomeView({ stats, todayDone, todayScore, onPlay, onPractice, onStats, onShop, onBackup }) {
  const avg = stats.played ? Math.round(stats.totalScore / stats.played) : 0;
  return (
    <div className="view home">
      <div className="hero">
        <div className="hero-mark">⚡</div>
        <h1 className="hero-title">Reflexly</h1>
        <p className="hero-sub">Four reflex stages. One run a day. Same run for everyone.</p>
      </div>

      {stats.streak > 0 && <div className="streak-chip">🔥 {stats.streak} day{stats.streak === 1 ? "" : "s"} in a row</div>}

      {todayDone ? (
        <div className="done-card">
          <div className="done-label">Today's score</div>
          <div className="done-score">{todayScore}<span className="done-max">/{MAX_SCORE}</span></div>
          <button className="btn btn-primary" onClick={onPlay}>See results</button>
          <button className="btn btn-ghost" onClick={onPractice}>Practice run</button>
        </div>
      ) : (
        <div className="cta-stack">
          <button className="btn btn-primary btn-big" onClick={onPlay}>Start today's run</button>
          <button className="btn btn-ghost" onClick={onPractice}>Practice run</button>
        </div>
      )}

      <div className="stat-row">
        <div className="stat-cell"><div className="stat-num">{stats.played}</div><div className="stat-cap">Runs</div></div>
        <div className="stat-cell"><div className="stat-num">{stats.bestScore}</div><div className="stat-cap">Best</div></div>
        <div className="stat-cell">
          <div className="stat-num">{stats.bestReaction != null ? stats.bestReaction : "—"}</div>
          <div className="stat-cap">Fastest ms</div>
        </div>
      </div>

      <div className="link-row">
        <button className="link-btn" onClick={onStats}>Stats</button>
        <button className="link-btn" onClick={onShop}>Themes</button>
        <button className="link-btn" onClick={onBackup}>Backup</button>
      </div>
    </div>
  );
}

function RunView({ seedKey, isPractice, onDone, onQuit }) {
  const [stageIndex, setStageIndex] = useState(0);
  const [scores, setScores] = useState([]);
  const [details, setDetails] = useState([]);
  // One generator for the whole run so every stage's randomness stays
  // deterministic for a given day regardless of how fast stages are played.
  const randRef = useRef(mulberry32(hashString(seedKey)));

  const finishStage = useCallback(
    (score, detail) => {
      const nextScores = [...scores, score];
      const nextDetails = [...details, detail];
      setScores(nextScores);
      setDetails(nextDetails);
      if (stageIndex + 1 >= STAGES.length) onDone(nextScores, nextDetails);
      else setStageIndex(stageIndex + 1);
    },
    [scores, details, stageIndex, onDone]
  );

  const rand = randRef.current;
  const key = STAGES[stageIndex].key;

  return (
    <div className="view run">
      <div className="run-top">
        <button className="quit-btn" onClick={onQuit} aria-label="Quit">✕</button>
        <div className="pips">
          {STAGES.map((s, i) => (
            <span key={s.key} className={"pip" + (i < scores.length ? " pip-done" : "") + (i === stageIndex ? " pip-now" : "")} />
          ))}
        </div>
        {isPractice && <div className="practice-tag">Practice</div>}
      </div>

      <div className="run-progress">Stage {stageIndex + 1} of {STAGES.length}</div>

      {key === "react" && <StageReact key="react" rand={rand} onDone={finishStage} />}
      {key === "targets" && <StageTargets key="targets" rand={rand} onDone={finishStage} />}
      {key === "sequence" && <StageSequence key="sequence" rand={rand} onDone={finishStage} />}
      {key === "match" && <StageMatch key="match" rand={rand} onDone={finishStage} />}
    </div>
  );
}

function Ring({ value, max }) {
  const pct = max > 0 ? Math.min(1, value / max) : 0;
  const R = 52;
  const C = 2 * Math.PI * R;
  return (
    <div className="ring-wrap">
      <svg viewBox="0 0 120 120" className="ring">
        <circle cx="60" cy="60" r={R} className="ring-track" />
        <circle cx="60" cy="60" r={R} className="ring-fill" strokeDasharray={C} strokeDashoffset={C * (1 - pct)} />
      </svg>
      <div className="ring-label">
        <div className="ring-value">{value}</div>
        <div className="ring-sub">of {max}</div>
      </div>
    </div>
  );
}

function gradeFor(score) {
  const pct = score / MAX_SCORE;
  if (pct >= 0.9) return { label: "Lightning", emoji: "⚡" };
  if (pct >= 0.75) return { label: "Quick", emoji: "🌟" };
  if (pct >= 0.6) return { label: "Sharp", emoji: "👍" };
  if (pct >= 0.4) return { label: "Warming up", emoji: "🙂" };
  return { label: "Room to grow", emoji: "🌱" };
}

function ResultsView({ scores, details, stats, isPractice, puzzleNo, onHome, onPractice }) {
  const [copied, setCopied] = useState(false);
  const total = scores.reduce((a, b) => a + b, 0);
  const grade = gradeFor(total);

  const share = () => {
    const bars = scores.map((s) => {
      const f = s / MAX_STAGE;
      if (f >= 0.85) return "🟩";
      if (f >= 0.6) return "🟨";
      if (f >= 0.3) return "🟧";
      return "⬜";
    }).join("");
    const text = [
      `Reflexly #${puzzleNo} — ${total}/${MAX_SCORE}`,
      bars,
      details[0] && details[0].best != null ? `⚡ ${details[0].best}ms best reaction` : "",
      stats.streak > 1 ? `🔥 ${stats.streak}` : "",
    ].filter(Boolean).join("\n");

    if (navigator.share) navigator.share({ text }).catch(() => {});
    else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      });
    }
  };

  const describe = (i) => {
    const d = details[i] || {};
    if (i === 0) return d.avg != null ? `${d.avg}ms average` : "—";
    if (i === 1) return d.ms != null ? `${(d.ms / 1000).toFixed(1)}s` : "—";
    if (i === 2) return d.level ? `length ${d.level}` : "no rounds cleared";
    if (i === 3) return `${d.correct || 0} right · ${d.wrong || 0} wrong`;
    return "";
  };

  return (
    <div className="view results">
      <div className="result-head">
        <div className="grade-emoji">{grade.emoji}</div>
        <div className="grade-label">{grade.label}</div>
      </div>

      <Ring value={total} max={MAX_SCORE} />

      <div className="review">
        {STAGES.map((s, i) => (
          <div key={s.key} className="review-row">
            <span className="review-q"><b>{s.label}</b> · {describe(i)}</span>
            <span className="review-pts">{scores[i]}</span>
          </div>
        ))}
      </div>

      {!isPractice && (
        <button className="btn btn-primary" onClick={share}>{copied ? "Copied!" : "Share score"}</button>
      )}
      <button className="btn btn-ghost" onClick={onPractice}>Practice run</button>
      <button className="btn btn-ghost" onClick={onHome}>Home</button>
    </div>
  );
}

// ---------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------
function Modal({ title, onClose, children }) {
  return (
    <div className="modal" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <h2>{title}</h2>
          <button className="close-btn" onClick={onClose} aria-label="Close">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function StatsModal({ stats, onClose }) {
  const avg = stats.played ? Math.round(stats.totalScore / stats.played) : 0;
  const recent = stats.history.slice(-14);
  const peak = Math.max(1, ...recent.map((h) => h.score));
  return (
    <Modal title="Your stats" onClose={onClose}>
      <div className="stat-grid">
        <div><b>{stats.played}</b><span>Runs</span></div>
        <div><b>{stats.bestScore}</b><span>Best</span></div>
        <div><b>{avg}</b><span>Average</span></div>
        <div><b>{stats.bestReaction != null ? stats.bestReaction : "—"}</b><span>Fastest ms</span></div>
        <div><b>{stats.streak}</b><span>Streak</span></div>
        <div><b>{stats.maxStreak}</b><span>Longest</span></div>
      </div>
      {recent.length > 0 && (
        <>
          <div className="chart-cap">Last {recent.length} runs</div>
          <div className="chart">
            {recent.map((h, i) => (
              <div key={i} className="bar-slot" title={`${h.date}: ${h.score}`}>
                <div className="bar" style={{ height: `${(h.score / peak) * 100}%` }} />
              </div>
            ))}
          </div>
        </>
      )}
    </Modal>
  );
}

function ShopModal({ owned, palette, pro, onPick, onClose }) {
  return (
    <Modal title="Themes" onClose={onClose}>
      <p className="sheet-note">Colour themes only — they never change the stages, the timing, or your score.</p>
      <div className="palette-grid">
        {PALETTES.map((p) => {
          const unlocked = p.free || pro || owned.includes(p.id);
          return (
            <button
              key={p.id}
              className={"palette" + (palette === p.id ? " active" : "") + (unlocked ? "" : " locked")}
              onClick={() => onPick(p.id, unlocked)}
            >
              <span className="swatch" style={{ background: `linear-gradient(135deg, ${p.accent}, ${p.accent2})` }} />
              <span className="palette-name">{p.name}</span>
              {!unlocked && <span className="lock">🔒</span>}
            </button>
          );
        })}
      </div>
      <div className="testing-note">Testing preview — unlocks are free for now and will connect to real purchases at launch.</div>
    </Modal>
  );
}

function BackupModal({ onClose, onImported }) {
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);

  const exportData = () => {
    const payload = {
      app: "reflexly", version: 1, exportedAt: new Date().toISOString(),
      data: Object.fromEntries(
        Object.values(K).map((key) => [key, localStorage.getItem(key)]).filter(([, v]) => v !== null)
      ),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `reflexly-backup-${dateKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg("Backup downloaded.");
  };

  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.app !== "reflexly" || !parsed.data) { setMsg("That file isn't a Reflexly backup."); return; }
        Object.entries(parsed.data).forEach(([key, value]) => {
          if (typeof value === "string") localStorage.setItem(key, value);
        });
        setMsg("Restored. Reloading…");
        setTimeout(onImported, 700);
      } catch (err) { setMsg("Couldn't read that file."); }
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Backup & restore" onClose={onClose}>
      <p className="sheet-note">Your scores live only on this device. Export a copy before switching phones — free, always.</p>
      <button className="btn btn-primary" onClick={exportData}>Export my data</button>
      <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>Restore from file</button>
      <input ref={fileRef} type="file" accept="application/json" onChange={importData} hidden />
      {msg && <div className="sheet-msg">{msg}</div>}
    </Modal>
  );
}

// ---------------------------------------------------------------------
// App
// ---------------------------------------------------------------------
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem(K.theme) || "dark");
  const [palette, setPalette] = useState(() => localStorage.getItem(K.palette) || "neon");
  const [pro] = useState(() => localStorage.getItem(K.pro) === "1");
  const [owned, setOwned] = useState(() => readJSON(K.owned, []));
  const [stats, setStats] = useState(() => ({ ...EMPTY_STATS, ...readJSON(K.stats, {}) }));
  const [daily, setDaily] = useState(() => readJSON(K.daily, {}));

  const [screen, setScreen] = useState("home");
  const [practice, setPractice] = useState(false);
  const [seedKey, setSeedKey] = useState(null);
  const [lastRun, setLastRun] = useState(null);
  const [modal, setModal] = useState(null);

  const today = dateKey();
  const puzzleNo = puzzleNumber(today);
  const todayEntry = daily[today];

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(K.theme, theme);
  }, [theme]);

  useEffect(() => {
    const p = PALETTES.find((x) => x.id === palette) || PALETTES[0];
    document.documentElement.style.setProperty("--accent", p.accent);
    document.documentElement.style.setProperty("--accent-2", p.accent2);
    localStorage.setItem(K.palette, palette);
  }, [palette]);

  useEffect(() => writeJSON(K.stats, stats), [stats]);
  useEffect(() => writeJSON(K.daily, daily), [daily]);
  useEffect(() => writeJSON(K.owned, owned), [owned]);

  const startDaily = () => {
    if (todayEntry) {
      setLastRun({ scores: todayEntry.scores, details: todayEntry.details });
      setPractice(false);
      setScreen("results");
      return;
    }
    setSeedKey(today);
    setPractice(false);
    setScreen("run");
  };

  const startPractice = () => {
    setSeedKey(`practice-${Date.now()}-${Math.random()}`);
    setPractice(true);
    setScreen("run");
  };

  const finish = (scores, details) => {
    const total = scores.reduce((a, b) => a + b, 0);
    if (!practice) {
      setDaily((d) => ({ ...d, [today]: { scores, details, score: total } }));
      setStats((s) => recordResult(s, today, total, details[0] ? details[0].best : null));
    }
    setLastRun({ scores, details });
    setScreen("results");
  };

  const pickPalette = (id, unlocked) => {
    if (!unlocked && !owned.includes(id)) setOwned((o) => [...o, id]);
    setPalette(id);
  };

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">Reflexly</div>
        <div className="top-actions">
          <span className="puzzle-no">#{puzzleNo}</span>
          <button className="icon-btn" onClick={() => setTheme(theme === "light" ? "dark" : "light")} aria-label="Toggle theme">
            {theme === "light" ? "🌙" : "☀️"}
          </button>
        </div>
      </header>

      {screen === "home" && (
        <HomeView
          stats={stats}
          todayDone={Boolean(todayEntry)}
          todayScore={todayEntry ? todayEntry.score : 0}
          onPlay={startDaily}
          onPractice={startPractice}
          onStats={() => setModal("stats")}
          onShop={() => setModal("shop")}
          onBackup={() => setModal("backup")}
        />
      )}

      {screen === "run" && seedKey && (
        <RunView
          key={seedKey}
          seedKey={seedKey}
          isPractice={practice}
          onDone={finish}
          onQuit={() => setScreen("home")}
        />
      )}

      {screen === "results" && lastRun && (
        <ResultsView
          scores={lastRun.scores}
          details={lastRun.details}
          stats={stats}
          isPractice={practice}
          puzzleNo={puzzleNo}
          onHome={() => setScreen("home")}
          onPractice={startPractice}
        />
      )}

      {modal === "stats" && <StatsModal stats={stats} onClose={() => setModal(null)} />}
      {modal === "shop" && <ShopModal owned={owned} palette={palette} pro={pro} onPick={pickPalette} onClose={() => setModal(null)} />}
      {modal === "backup" && <BackupModal onClose={() => setModal(null)} onImported={() => window.location.reload()} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
