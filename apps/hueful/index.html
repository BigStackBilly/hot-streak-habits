<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
// =====================================================================
// HUEFUL — a small local-first color-sort puzzle, with real levels
//
// Fifth sibling game, same house style: inline index.html, zero build
// step, plain DOM/CSS + setTimeout sequencing (not canvas/rAF — see
// Brobots/Bubblio for why that matters: requestAnimationFrame never
// fires on a hidden/backgrounded tab). This game has no continuous
// motion at all, though — pouring is a discrete, instant state change —
// so it's the simplest engine in the family by a wide margin.
//
// LEVEL GENERATION: rather than trying to verify a randomly-generated
// board is solvable, every level is generated by starting from the
// SOLVED state (each tube one solid color) and applying N random legal
// pours as a "scramble." Every pour is trivially reversible by pouring
// back, so a scrambled board generated this way is *always* solvable —
// no solver needed to guarantee it.
//
// Organized top to bottom as:
//   1. Levels & palettes    - tube/level config, free + Pro color packs
//   2. Board logic           - pure functions: canPour, pour, isSolved,
//                              scramble-from-solved level generation
//   3. localStorage helpers  - progress (stars/level), theme, pro
//   4. Small components (Confetti, UpgradeModal, BackupModal, LevelCompleteModal)
//   5. Tube / Board           - the tube row + tap-tap pour UI
//   6. App                    - level select + top-level state
// =====================================================================

const { useState, useEffect, useRef } = React;

const PROGRESS_KEY = "hueful.progress.v1";
const THEME_KEY = "hueful.theme.v1";
const PRO_KEY = "hueful.pro.v1";
const PACK_KEY = "hueful.pack.v1";
const PRO_PRICE = "$3.99";

// ---------------------------------------------------------------------
// 1. LEVELS & PALETTES
// ---------------------------------------------------------------------

const CAPACITY = 4;
const EMPTY_TUBES = 2;
const TOTAL_LEVELS = 30;

const PALETTES = {
  candy: {
    name: "Candy", free: true,
    colors: ["#FCA5A5", "#93C5FD", "#86EFAC", "#FDE047", "#D8B4FE", "#67E8F9", "#FDBA74", "#F9A8D4"],
  },
  pastel: {
    name: "Pastel", price: "$1.99",
    colors: ["#FBCFE8", "#BFDBFE", "#BBF7D0", "#FEF08A", "#E9D5FF", "#A5F3FC", "#FED7AA", "#FBCFE8"],
  },
  neon: {
    name: "Neon", price: "$1.99",
    colors: ["#FB7185", "#60A5FA", "#4ADE80", "#FACC15", "#E879F9", "#22D3EE", "#FB923C", "#F472B6"],
  },
  midnight: {
    name: "Midnight", price: "$1.99",
    colors: ["#F87171", "#818CF8", "#34D399", "#FBBF24", "#C084FC", "#38BDF8", "#FB923C", "#F472B6"],
  },
};

// Capped at 6 colors (not higher): a real backtracking solvability check
// runs at generation time (see solveBoard below), and its runtime grows
// very fast with color count -- 8 colors took multiple seconds and, with
// a plain BFS, sometimes didn't finish at all within a sane node budget.
// 6 colors / 8 tubes is still a genuinely hard puzzle for a casual game
// and keeps generation comfortably fast.
function levelConfig(levelNum) {
  const colorCount = Math.min(3 + Math.floor(levelNum / 5), 6);
  return { colorCount, tubeCount: colorCount + EMPTY_TUBES, seed: levelNum * 7919 + 13 };
}

function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------------
// 2. BOARD LOGIC
//
// A "board" is an array of tubes; each tube is an array of color
// indices, bottom-first (so the LAST element is the top of the tube —
// the one you'd pour off first).
// ---------------------------------------------------------------------

function topColor(tube) {
  return tube.length ? tube[tube.length - 1] : null;
}

// How many same-color segments sit on top of `tube`, i.e. how much
// would move in one pour (capped by nothing here — capped by the
// destination's free space in canPour/pourAmount).
function topRunLength(tube) {
  if (tube.length === 0) return 0;
  const color = topColor(tube);
  let n = 0;
  for (let i = tube.length - 1; i >= 0 && tube[i] === color; i--) n++;
  return n;
}

function canPour(source, dest) {
  if (source.length === 0) return false;
  if (dest.length >= CAPACITY) return false;
  if (dest.length === 0) return true;
  return topColor(dest) === topColor(source);
}

function pourAmount(source, dest) {
  const run = topRunLength(source);
  const space = CAPACITY - dest.length;
  return Math.min(run, space);
}

function pour(board, sourceIdx, destIdx) {
  const next = board.map((t) => t.slice());
  const amount = pourAmount(next[sourceIdx], next[destIdx]);
  const color = topColor(next[sourceIdx]);
  for (let i = 0; i < amount; i++) {
    next[sourceIdx].pop();
    next[destIdx].push(color);
  }
  return next;
}

function isSolved(board) {
  return board.every((tube) => tube.length === 0 || (tube.every((c) => c === tube[0]) && tube.length === CAPACITY));
}

// A backtracking solvability check used only to VALIDATE a generated
// board (not shown to the player, not used for hints, and its return
// value is only ever used as a yes/no -- see createLevelBoard for why
// it doesn't drive the star-rating "par"). Three approaches were tried
// here, in order, each rejected for a concrete measured reason:
//   1. A pure greedy walk (no backtracking) reliably paints itself into
//      a corner -- water-sort puzzles routinely need a move that looks
//      locally pointless to unblock the rest of the board -- and
//      rejected literally every board it tried across all 30 levels.
//   2. Plain BFS finds a true shortest solution, but branches on every
//      legal move at every frontier board, so it blows up combinatorially
//      for a full 8-color/10-tube puzzle (confirmed: didn't finish
//      within a 30-second budget across 30 levels).
//   3. Beam-limited BFS (bounded branching) is fast, but at 8 colors it
//      sometimes prunes away the only path to a solution and reports a
//      genuinely-solvable board as unsolvable (confirmed empirically).
// The fix that actually worked was capping colorCount at 6 (see
// levelConfig) rather than chasing a cleverer solver -- backtracking DFS
// with memoization is fast and reliable at that size. It can still find
// a needlessly long path, which is fine here since only solvability
// (not the path length) is used.
function serializeBoard(board) {
  return board.map((t) => t.join(",")).join("|");
}

function solveBoard(board, nodeBudget) {
  const visited = new Set([serializeBoard(board)]);
  const stack = [board];
  let nodes = 0;

  while (stack.length > 0 && nodes < nodeBudget) {
    const b = stack.pop();
    nodes++;
    if (isSolved(b)) return true;

    for (let i = 0; i < b.length; i++) {
      for (let j = 0; j < b.length; j++) {
        if (i === j || !canPour(b[i], b[j])) continue;
        const nb = pour(b, i, j);
        const key = serializeBoard(nb);
        if (visited.has(key)) continue;
        visited.add(key);
        stack.push(nb);
      }
    }
  }
  return false;
}

// Builds a level by dealing a shuffled multiset of colored segments
// (CAPACITY of each color) into `colorCount` tubes, leaving EMPTY_TUBES
// empty. Unlike scrambling forward from a solved state -- which turns
// out to be a dead end, since every non-empty tube starts completely
// full and uniform, so the ONLY legal moves are whole-tube swaps with
// an empty tube, which can never break up a color into a partial tube
// no matter how many "random" moves run -- a random deal genuinely
// mixes colors across tubes. This is the same generation method real
// water-sort/ball-sort games use. Verified per-level with solveBoard()
// rather than taken on faith, and reshuffled (advancing the seeded RNG)
// on the rare chance a deal comes out already solved or truly unsolvable.
//
// "par" (used only for the star-rating thresholds) is a plain formula
// off colorCount, not the solver's own path length -- deliberately: the
// solver above is only asked a yes/no question and, per its own doc
// comment, can return a wildly inefficient path when it does find one,
// which would make a terrible par value.
function createLevelBoard(levelNum) {
  const { colorCount, seed } = levelConfig(levelNum);
  const parMoves = colorCount * 6;

  for (let attempt = 0; attempt < 12; attempt++) {
    const rng = makeRng(seed + attempt * 104729);
    const tokens = [];
    for (let c = 0; c < colorCount; c++) for (let i = 0; i < CAPACITY; i++) tokens.push(c);
    for (let i = tokens.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [tokens[i], tokens[j]] = [tokens[j], tokens[i]];
    }

    const board = [];
    for (let c = 0; c < colorCount; c++) board.push(tokens.slice(c * CAPACITY, (c + 1) * CAPACITY));
    for (let e = 0; e < EMPTY_TUBES; e++) board.push([]);

    if (isSolved(board)) continue;
    if (solveBoard(board, 30000)) return { board, parMoves };
  }
  // Exhausted every retry (should be effectively unreachable at
  // colorCount <= 6) -- fall back to whatever the last attempt produced
  // rather than crash.
  const rng = makeRng(seed);
  const tokens = [];
  for (let c = 0; c < colorCount; c++) for (let i = 0; i < CAPACITY; i++) tokens.push(c);
  const board = [];
  for (let c = 0; c < colorCount; c++) board.push(tokens.slice(c * CAPACITY, (c + 1) * CAPACITY));
  for (let e = 0; e < EMPTY_TUBES; e++) board.push([]);
  return { board, parMoves };
}

// ---------------------------------------------------------------------
// 3. LOCALSTORAGE HELPERS
// ---------------------------------------------------------------------

function loadProgress() {
  try {
    const raw = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (raw) return raw;
  } catch {}
  return { unlockedLevel: 1, stars: {} };
}
function saveProgress(p) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }
function loadTheme() { return localStorage.getItem(THEME_KEY) || "light"; }
function loadPro() {
  try {
    const raw = JSON.parse(localStorage.getItem(PRO_KEY));
    if (raw) return raw;
  } catch {}
  return { owned: false };
}
function savePro(pro) { localStorage.setItem(PRO_KEY, JSON.stringify(pro)); }
function loadPack() { return localStorage.getItem(PACK_KEY) || "candy"; }
function savePack(id) { localStorage.setItem(PACK_KEY, id); }

function playPour() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(500, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(340, ctx.currentTime + 0.16);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.18);
  } catch {}
}
function playThud() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "triangle";
    osc.frequency.value = 200;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.12);
  } catch {}
}

// ---------------------------------------------------------------------
// 4. SMALL COMPONENTS
// ---------------------------------------------------------------------

function Confetti() {
  const colors = ["#2DD4BF", "#6366F1", "#FDBA74", "#F9A8D4", "#ffffff"];
  const pieces = Array.from({ length: 28 }, (_, i) => ({
    id: i, left: Math.random() * 100, color: colors[i % colors.length],
    delay: Math.random() * 0.3, duration: 1.4 + Math.random() * 0.8,
  }));
  return (
    <>
      {pieces.map((p) => (
        <div key={p.id} className="confetti-piece" style={{ left: `${p.left}%`, background: p.color, animationDelay: `${p.delay}s`, animationDuration: `${p.duration}s` }} />
      ))}
    </>
  );
}

function UpgradeModal({ pro, pack, onPurchase, onSelectPack, onClose }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <h2>Hueful Pro</h2>
        {pro.owned ? (
          <>
            <p className="upgrade-copy">✓ Pro is unlocked on this device — thanks for supporting the app! Pick any color pack:</p>
            <div className="pack-grid">
              {Object.entries(PALETTES).map(([id, p]) => (
                <button key={id} type="button" className={`pack-option ${pack === id ? "selected" : ""}`} onClick={() => onSelectPack(id)}>
                  <div className="pack-swatch">{p.colors.slice(0, 4).map((c, i) => <span key={i} style={{ background: c }} />)}</div>
                  {p.name}
                </button>
              ))}
            </div>
            <div className="modal-buttons" style={{ marginTop: 16 }}>
              <button className="btn btn-primary" onClick={onClose}>Close</button>
            </div>
          </>
        ) : (
          <>
            <p className="upgrade-copy">Unlock Pro for 3 extra color packs — Pastel, Neon, and Midnight. Purely cosmetic, never required to play.</p>
            <div className="pack-grid">
              {Object.entries(PALETTES).map(([id, p]) => (
                <div key={id} className={`pack-option ${p.free ? "" : "locked"}`}>
                  <div className="pack-swatch">{p.colors.slice(0, 4).map((c, i) => <span key={i} style={{ background: c }} />)}</div>
                  {p.name}{!p.free && " 🔒"}
                </div>
              ))}
            </div>
            <div className="modal-buttons-column" style={{ marginTop: 16 }}>
              <button className="btn btn-primary" onClick={onPurchase}>Unlock Pro — {PRO_PRICE}</button>
              <button className="btn btn-secondary" onClick={onClose}>Not now</button>
            </div>
          </>
        )}
        <p className="theme-note">Testing preview — this unlocks Pro locally on this device only; it isn't wired up to real payment yet. Real App Store/Play Store billing will replace this before launch.</p>
      </div>
    </div>
  );
}

const BACKUP_KEYS = [PROGRESS_KEY, THEME_KEY, PRO_KEY, PACK_KEY];

function BackupModal({ onClose }) {
  const [status, setStatus] = useState(null);
  const fileInputRef = useRef(null);

  function handleDownload() {
    const data = {};
    BACKUP_KEYS.forEach((k) => { const v = localStorage.getItem(k); if (v !== null) data[k] = v; });
    const payload = { app: "hueful", exportedAt: new Date().toISOString(), data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `hueful-backup.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus({ type: "success", text: "Backup downloaded." });
  }
  function handleRestoreClick() { setStatus(null); if (fileInputRef.current) fileInputRef.current.click(); }
  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch { setStatus({ type: "error", text: "That file isn't valid backup JSON." }); return; }
      if (!parsed || parsed.app !== "hueful" || typeof parsed.data !== "object" || parsed.data === null) {
        setStatus({ type: "error", text: "That doesn't look like a Hueful backup file." }); return;
      }
      const confirmed = window.confirm("This will replace everything currently on this device. Continue?");
      if (!confirmed) return;
      Object.keys(parsed.data).forEach((k) => localStorage.setItem(k, parsed.data[k]));
      window.location.reload();
    };
    reader.onerror = () => setStatus({ type: "error", text: "Couldn't read that file. Try again." });
    reader.readAsText(file);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <h2>Backup & Restore</h2>
        <p className="upgrade-copy">Save your level progress, stars, and settings to a file on your device — and bring it back later, even after reinstalling or switching phones.</p>
        <label className="field-label">Download</label>
        <button type="button" className="btn btn-primary" style={{ width: "100%", marginBottom: 18 }} onClick={handleDownload}>⬇ Download backup</button>
        <label className="field-label">Restore</label>
        <button type="button" className="btn btn-secondary" style={{ width: "100%" }} onClick={handleRestoreClick}>⬆ Restore from backup</button>
        <input ref={fileInputRef} type="file" accept="application/json,.json" className="backup-file-input" onChange={handleFileChange} />
        {status && <p className={status.type === "error" ? "backup-status backup-status-error" : "backup-status backup-status-success"}>{status.text}</p>}
        <div className="modal-buttons" style={{ marginTop: 20 }}>
          <button className="btn btn-secondary" onClick={onClose}>Close</button>
        </div>
        <p className="theme-note">Free, always — this is your data, not a premium feature. Nothing leaves your device.</p>
      </div>
    </div>
  );
}

function StarRow({ count }) {
  return (
    <div className="star-row">
      {[1, 2, 3].map((i) => <span key={i} className={i <= count ? "star lit" : "star"}>★</span>)}
    </div>
  );
}

function LevelCompleteModal({ stars, moves, onNext, onReplay, hasNext }) {
  return (
    <div className="modal-overlay">
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <Confetti />
        <h2>🎉 Sorted!</h2>
        <StarRow count={stars} />
        <p className="upgrade-copy" style={{ textAlign: "center" }}>Solved in {moves} pour{moves === 1 ? "" : "s"}.</p>
        <div className="modal-buttons-column">
          {hasNext && <button className="btn btn-primary" onClick={onNext}>▶ Next level</button>}
          <button className="btn btn-secondary" onClick={onReplay}>🔁 Replay</button>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------
// 5. TUBE / BOARD
// ---------------------------------------------------------------------

function Tube({ tube, index, selected, onTap, palette }) {
  const slots = [];
  for (let i = 0; i < CAPACITY; i++) {
    const color = tube[i];
    slots.push(
      <div key={i} className={`tube-slot ${color !== undefined ? "filled" : ""}`} style={color !== undefined ? { background: palette.colors[color] } : undefined} />
    );
  }
  return (
    <button className={`tube ${selected ? "selected" : ""}`} onClick={() => onTap(index)} aria-label={`Tube ${index + 1}`}>
      <div className="tube-slots">{slots.slice().reverse()}</div>
    </button>
  );
}

function Board({ board, selected, palette, onTap }) {
  return (
    <div className="tube-row">
      {board.map((tube, i) => (
        <Tube key={i} tube={tube} index={i} selected={selected === i} onTap={onTap} palette={palette} />
      ))}
    </div>
  );
}

// ---------------------------------------------------------------------
// 6. APP
// ---------------------------------------------------------------------

function App() {
  const [theme, setTheme] = useState(loadTheme);
  const [pro, setPro] = useState(loadPro);
  const [packId, setPackId] = useState(loadPack);
  const [progress, setProgress] = useState(loadProgress);
  const [screen, setScreen] = useState("menu");
  const [levelNum, setLevelNum] = useState(1);
  const [board, setBoard] = useState([]);
  const [parMoves, setParMoves] = useState(0);
  const [selected, setSelected] = useState(null);
  const [moves, setMoves] = useState(0);
  const [history, setHistory] = useState([]);
  const [won, setWon] = useState(false);
  const [upgradeModalOpen, setUpgradeModalOpen] = useState(false);
  const [backupModalOpen, setBackupModalOpen] = useState(false);

  useEffect(() => {
    localStorage.setItem(THEME_KEY, theme);
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);
  useEffect(() => { savePro(pro); }, [pro]);
  useEffect(() => { savePack(packId); }, [packId]);
  useEffect(() => { saveProgress(progress); }, [progress]);

  const palette = PALETTES[packId] && (PALETTES[packId].free || pro.owned) ? PALETTES[packId] : PALETTES.candy;

  function startLevel(n) {
    const { board: newBoard, parMoves: newPar } = createLevelBoard(n);
    setBoard(newBoard);
    setParMoves(newPar);
    setLevelNum(n);
    setMoves(0);
    setHistory([]);
    setSelected(null);
    setWon(false);
    setScreen("play");
  }

  function handleTap(idx) {
    if (won) return;
    if (selected === null) {
      if (board[idx].length === 0) return;
      setSelected(idx);
      return;
    }
    if (selected === idx) {
      setSelected(null);
      return;
    }
    if (canPour(board[selected], board[idx])) {
      playPour();
      const next = pour(board, selected, idx);
      setHistory((h) => [...h, board]);
      setBoard(next);
      setSelected(null);
      setMoves((m) => m + 1);
      if (isSolved(next)) {
        const finalMoves = moves + 1;
        const stars = finalMoves <= parMoves ? 3 : finalMoves <= parMoves * 1.5 ? 2 : 1;
        setWon(true);
        setProgress((p) => ({
          unlockedLevel: Math.max(p.unlockedLevel, Math.min(levelNum + 1, TOTAL_LEVELS)),
          stars: { ...p.stars, [levelNum]: Math.max(p.stars[levelNum] || 0, stars) },
        }));
      }
    } else {
      playThud();
      setSelected(board[idx].length === 0 ? null : idx);
    }
  }

  // Undoing is free (doesn't cost a move going backward, but the
  // reversed move still counts toward `moves` going forward again if
  // re-poured) -- it's a convenience for misclicks and backtracking a
  // plan, not a way to game the star rating, so it only rewinds the
  // board + move counter and is unavailable once a level is won.
  function handleUndo() {
    if (history.length === 0 || won) return;
    const prev = history[history.length - 1];
    setBoard(prev);
    setHistory((h) => h.slice(0, -1));
    setMoves((m) => Math.max(0, m - 1));
    setSelected(null);
  }

  function handleNext() { startLevel(Math.min(levelNum + 1, TOTAL_LEVELS)); }
  function handleReplay() { startLevel(levelNum); }
  function handlePurchasePro() { setPro({ owned: true }); }
  function handleSelectPack(id) { if (PALETTES[id].free || pro.owned) setPackId(id); }

  const totalStars = Object.values(progress.stars).reduce((a, b) => a + b, 0);
  const currentStars = won ? (moves <= parMoves ? 3 : moves <= parMoves * 1.5 ? 2 : 1) : 0;

  return (
    <div className="app">
      <header className="app-header">
        <h1 className="app-title">
          <span className="logo">🧪</span> Hueful
        </h1>
        <div className="header-buttons">
          <button className="theme-toggle" onClick={() => setUpgradeModalOpen(true)} aria-label="Hueful Pro">{pro.owned ? "⭐" : "👑"}</button>
          <button className="theme-toggle" onClick={() => setTheme((t) => (t === "light" ? "dark" : "light"))} aria-label="Toggle dark mode">{theme === "light" ? "🌙" : "☀️"}</button>
          <button className="theme-toggle" onClick={() => setBackupModalOpen(true)} aria-label="Backup & Restore">💾</button>
        </div>
      </header>

      {screen === "menu" ? (
        <div className="level-select">
          <p className="stats-row">⭐ {totalStars} total stars · {progress.unlockedLevel < TOTAL_LEVELS ? `${progress.unlockedLevel}/${TOTAL_LEVELS} unlocked` : "all levels unlocked"}</p>
          <div className="level-grid">
            {Array.from({ length: TOTAL_LEVELS }, (_, i) => i + 1).map((n) => {
              const locked = n > progress.unlockedLevel;
              const stars = progress.stars[n] || 0;
              return (
                <button key={n} className={`level-tile ${locked ? "locked" : ""}`} disabled={locked} onClick={() => startLevel(n)}>
                  <span className="level-num">{locked ? "🔒" : n}</span>
                  {!locked && <StarRow count={stars} />}
                </button>
              );
            })}
          </div>
        </div>
      ) : (
        <>
          <div className="score-row">
            <div className="score-box">
              <span className="score-label">Level</span>
              <span className="score-value">{levelNum}</span>
            </div>
            <div className="score-box">
              <span className="score-label">Pours</span>
              <span className="score-value best">{moves}</span>
            </div>
          </div>
          <p className="instructions">Tap a tube, then tap another to pour. Sort each color into its own tube!</p>
          <Board board={board} selected={selected} palette={palette} onTap={handleTap} />
          <div className="play-footer">
            <button className="link-btn" onClick={() => setScreen("menu")}>← Level select</button>
            <button className="link-btn" onClick={handleUndo} disabled={history.length === 0 || won}>↩ Undo</button>
          </div>
        </>
      )}

      {won && (
        <LevelCompleteModal stars={currentStars} moves={moves} hasNext={levelNum < TOTAL_LEVELS} onNext={handleNext} onReplay={handleReplay} />
      )}

      {upgradeModalOpen && (
        <UpgradeModal pro={pro} pack={packId} onPurchase={handlePurchasePro} onSelectPack={handleSelectPack} onClose={() => setUpgradeModalOpen(false)} />
      )}
      {backupModalOpen && <BackupModal onClose={() => setBackupModalOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
