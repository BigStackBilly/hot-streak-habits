const BASE_POINTS = 100;
const MAX_SPEED_BONUS = 100;
const MAX_SCORE = QUIZ_LENGTH * (BASE_POINTS + MAX_SPEED_BONUS);

// ---------------------------------------------------------------------
// 2. SEEDED RANDOMNESS
// Everyone gets the same quiz on the same calendar day because the seed
// is derived from the local date string, never from a server.
// ---------------------------------------------------------------------
function hashString(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  }
  return h;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function seededPick(seed, count, poolSize) {
  const rand = mulberry32(seed);
  const indices = Array.from({ length: poolSize }, (_, i) => i);
  // Fisher-Yates, but we only need the first `count` positions settled.
  for (let i = 0; i < count && i < indices.length - 1; i++) {
    const j = i + Math.floor(rand() * (indices.length - i));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return indices.slice(0, count);
}

function dateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

const EPOCH = new Date(2026, 0, 1);
function puzzleNumber(key) {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return Math.max(1, Math.round((date - EPOCH) / 86400000) + 1);
}

function buildQuiz(seedKey) {
  const seed = hashString(seedKey);
  const picks = seededPick(seed, QUIZ_LENGTH, QUESTIONS.length);
  const rand = mulberry32(seed ^ 0x9e3779b9);
  // Shuffle each question's options so the correct answer isn't always in
  // the same slot as it appears in the source bank.
  return picks.map((qi) => {
    const base = QUESTIONS[qi];
    const order = [0, 1, 2, 3];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return {
      id: base.id,
      q: base.q,
      category: base.category,
      options: order.map((o) => base.options[o]),
      correct: order.indexOf(base.correct),
    };
  });
}

// ---------------------------------------------------------------------
// 3. SCORING
// ---------------------------------------------------------------------
function scoreFor(correct, msRemaining) {
  if (!correct) return 0;
  const fraction = Math.max(0, Math.min(1, msRemaining / (SECONDS_PER_QUESTION * 1000)));
  return BASE_POINTS + Math.round(fraction * MAX_SPEED_BONUS);
}

function gradeFor(score) {
  const pct = score / MAX_SCORE;
  if (pct >= 0.9) return { label: "Genius", emoji: "🏆" };
  if (pct >= 0.75) return { label: "Sharp", emoji: "🌟" };
  if (pct >= 0.6) return { label: "Solid", emoji: "👍" };
  if (pct >= 0.4) return { label: "Warming up", emoji: "🙂" };
  return { label: "Room to grow", emoji: "🌱" };
}

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function writeJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* storage full or unavailable — the game still plays, it just won't persist */
  }
}

const EMPTY_STATS = {
  played: 0,
  totalScore: 0,
  bestScore: 0,
  perfect: 0,
  streak: 0,
  maxStreak: 0,
  lastPlayed: null,
  history: [],
};

function recordResult(stats, key, score, results) {
  const next = { ...stats };
  next.played += 1;
  next.totalScore += score;
  next.bestScore = Math.max(next.bestScore, score);
  if (results.every(Boolean)) next.perfect += 1;

  // A streak continues only if the previous play was literally yesterday.
  const yesterday = dateKey(new Date(Date.now() - 86400000));
  if (next.lastPlayed === yesterday) next.streak += 1;
  else if (next.lastPlayed === key) { /* same day replay — leave streak alone */ }
  else next.streak = 1;

  next.maxStreak = Math.max(next.maxStreak, next.streak);
  next.lastPlayed = key;
  next.history = [...next.history, { date: key, score }].slice(-60);
  return next;
}

function Ring({ value, max, label, sub }) {
  const pct = max > 0 ? Math.min(1, value / max) : 0;
  const R = 52;
  const C = 2 * Math.PI * R;
  return (
    <div className="ring-wrap">
      <svg viewBox="0 0 120 120" className="ring">
        <circle cx="60" cy="60" r={R} className="ring-track" />
        <circle
          cx="60"
          cy="60"
          r={R}
          className="ring-fill"
          strokeDasharray={C}
          strokeDashoffset={C * (1 - pct)}
        />
      </svg>
      <div className="ring-label">
        <div className="ring-value">{label}</div>
        <div className="ring-sub">{sub}</div>
      </div>
    </div>
  );
}

function HomeView({ stats, todayDone, todayScore, onPlay, onPractice, onStats, onShop, onBackup }) {

  return (

      <div className="hero">

        <h1 className="hero-title">Quizzly</h1>

      </div>

      {stats.streak > 0 && (
        <div className="streak-chip">🔥 {stats.streak} day{stats.streak === 1 ? "" : "s"} in a row</div>
      )}

      {todayDone ? (
        <div className="done-card">
          <div className="done-label">Today's score</div>

          <button className="btn btn-primary" onClick={onPlay}>See results</button>
          <button className="btn btn-ghost" onClick={onPractice}>Practice round</button>
        </div>
      ) : (
        <div className="cta-stack">
          <button className="btn btn-primary btn-big" onClick={onPlay}>Play today's quiz</button>
          <button className="btn btn-ghost" onClick={onPractice}>Practice round</button>
        </div>

        <div className="stat-cell"><div className="stat-num">{stats.played}</div><div className="stat-cap">Played</div></div>
        <div className="stat-cell"><div className="stat-num">{stats.bestScore}</div><div className="stat-cap">Best</div></div>
        <div className="stat-cell"><div className="stat-num">{avg}</div><div className="stat-cap">Average</div></div>
      </div>

      <div className="link-row">

        <button className="link-btn" onClick={onShop}>Themes</button>

function QuizView({ quiz, onDone, isPractice, onQuit }) {
  const [index, setIndex] = useState(0);
  const [picked, setPicked] = useState(null);
  const [results, setResults] = useState([]);
  const [scores, setScores] = useState([]);
  const [msLeft, setMsLeft] = useState(SECONDS_PER_QUESTION * 1000);

  // Refs mirror the state that the timer callback reads, so a tick that
  // fires between a click and the re-render can't act on a stale value.
  const pickedRef = useRef(null);
  const startedRef = useRef(Date.now());
  const advancingRef = useRef(false);

  const question = quiz[index];

  const advance = useCallback(
    (choice, remaining) => {
      if (advancingRef.current) return;
      advancingRef.current = true;

      const correct = choice === question.correct;
      const gained = scoreFor(correct, remaining);
      const nextResults = [...results, correct];
      const nextScores = [...scores, gained];
      setResults(nextResults);
      setScores(nextScores);

      setTimeout(() => {
        if (index + 1 >= quiz.length) {
          onDone(nextResults, nextScores);
        } else {
          setIndex(index + 1);
          setPicked(null);
          pickedRef.current = null;
          setMsLeft(SECONDS_PER_QUESTION * 1000);
          startedRef.current = Date.now();
          advancingRef.current = false;
        }
      }, 900);
    },
    [index, question, quiz.length, results, scores, onDone]
  );

  const choose = useCallback(
    (i) => {
      if (pickedRef.current !== null || advancingRef.current) return;
      pickedRef.current = i;
      setPicked(i);
      const remaining = SECONDS_PER_QUESTION * 1000 - (Date.now() - startedRef.current);
      advance(i, remaining);
    },
    [advance]
  );

  useEffect(() => {
    startedRef.current = Date.now();
    advancingRef.current = false;
    const timer = setInterval(() => {
      const elapsed = Date.now() - startedRef.current;
      const remaining = SECONDS_PER_QUESTION * 1000 - elapsed;
      setMsLeft(Math.max(0, remaining));
      if (remaining <= 0 && pickedRef.current === null && !advancingRef.current) {
        pickedRef.current = -1;
        setPicked(-1);
        advance(-1, 0);
      }
    }, 50);
    return () => clearInterval(timer);
  }, [index, advance]);

  const timePct = msLeft / (SECONDS_PER_QUESTION * 1000);

  return (
    <div className="view quiz">
      <div className="quiz-top">
        <button className="quit-btn" onClick={onQuit} aria-label="Quit">✕</button>
        <div className="pips">
          {quiz.map((_, i) => (
            <span
              key={i}
              className={
                "pip" +
                (i < results.length ? (results[i] ? " pip-ok" : " pip-no") : "") +
                (i === index ? " pip-now" : "")
              }
            />
          ))}
        </div>
        {isPractice && <div className="practice-tag">Practice</div>}
      </div>

      <div className="timer-track">
        <div
          className={"timer-fill" + (timePct < 0.25 ? " timer-low" : "")}
          style={{ width: `${timePct * 100}%` }}
        />
      </div>

      <div className="q-card">
        <div className="q-cat">{question.category}</div>
        <div className="q-text">{question.q}</div>
      </div>

      <div className="options">
        {question.options.map((opt, i) => {
          let cls = "opt";
          if (picked !== null) {
            if (i === question.correct) cls += " opt-correct";
            else if (i === picked) cls += " opt-wrong";
            else cls += " opt-dim";
          }
          return (
            <button key={i} className={cls} onClick={() => choose(i)} disabled={picked !== null}>
              <span className="opt-letter">{String.fromCharCode(65 + i)}</span>
              <span className="opt-text">{opt}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ResultsView({ quiz, results, scores, stats, isPractice, puzzleNo, onHome, onPractice }) {
  const [copied, setCopied] = useState(false);
  const total = scores.reduce((a, b) => a + b, 0);
  const correctCount = results.filter(Boolean).length;
  const grade = gradeFor(total);

  const share = () => {
    const grid = results.map((r) => (r ? "🟢" : "⚪")).join("");
    const lines = [
      `Quizzly #${puzzleNo} — ${total}/${MAX_SCORE}`,
      grid,
      `${correctCount}/${QUIZ_LENGTH} correct${stats.streak > 1 ? ` · 🔥${stats.streak}` : ""}`,
    ];
    const text = lines.join("\n");
    if (navigator.share) {
      navigator.share({ text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      });
    }
  };

  return (
    <div className="view results">
      <div className="result-head">
        <div className="grade-emoji">{grade.emoji}</div>
        <div className="grade-label">{grade.label}</div>
      </div>

      <Ring value={total} max={MAX_SCORE} label={total} sub={`of ${MAX_SCORE}`} />

      <div className="result-sub">{correctCount} of {QUIZ_LENGTH} correct</div>

      <div className="review">
        {quiz.map((q, i) => (
          <div key={i} className={"review-row" + (results[i] ? " ok" : " no")}>
            <span className="review-mark">{results[i] ? "✓" : "✕"}</span>
            <span className="review-q">{q.q}</span>
            <span className="review-pts">{scores[i] ? `+${scores[i]}` : "0"}</span>
          </div>
        ))}
      </div>

      {!isPractice && (
        <button className="btn btn-primary" onClick={share}>
          {copied ? "Copied!" : "Share score"}
        </button>
      )}
      <button className="btn btn-ghost" onClick={onPractice}>Practice round</button>
      <button className="btn btn-ghost" onClick={onHome}>Home</button>
    </div>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div className="modal" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <h2>{title}</h2>
          <button className="close-btn" onClick={onClose} aria-label="Close">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function StatsModal({ stats, onClose }) {
  const avg = stats.played ? Math.round(stats.totalScore / stats.played) : 0;
  const recent = stats.history.slice(-14);
  const peak = Math.max(1, ...recent.map((h) => h.score));
  return (
    <Modal title="Your stats" onClose={onClose}>
      <div className="stat-grid">
        <div><b>{stats.played}</b><span>Played</span></div>
        <div><b>{stats.bestScore}</b><span>Best</span></div>
        <div><b>{avg}</b><span>Average</span></div>
        <div><b>{stats.perfect}</b><span>Perfect</span></div>
        <div><b>{stats.streak}</b><span>Streak</span></div>
        <div><b>{stats.maxStreak}</b><span>Longest</span></div>
      </div>
      {recent.length > 0 && (
        <>
          <div className="chart-cap">Last {recent.length} quizzes</div>
          <div className="chart">
            {recent.map((h, i) => (
              <div key={i} className="bar-slot" title={`${h.date}: ${h.score}`}>
                <div className="bar" style={{ height: `${(h.score / peak) * 100}%` }} />
              </div>
            ))}
          </div>
        </>
      )}
    </Modal>
  );
}

function ShopModal({ owned, palette, pro, onPick, onClose }) {
  return (
    <Modal title="Themes" onClose={onClose}>
      <p className="sheet-note">
        Colour themes only — they never change the questions, the timer, or your score.
      </p>
      <div className="palette-grid">
        {PALETTES.map((p) => {
          const unlocked = p.free || pro || owned.includes(p.id);
          return (
            <button
              key={p.id}
              className={"palette" + (palette === p.id ? " active" : "") + (unlocked ? "" : " locked")}
              onClick={() => onPick(p.id, unlocked)}
            >
              <span className="swatch" style={{ background: `linear-gradient(135deg, ${p.accent}, ${p.accent2})` }} />
              <span className="palette-name">{p.name}</span>
              {!unlocked && <span className="lock">🔒</span>}
            </button>
          );
        })}
      </div>
      <div className="testing-note">
        Testing preview — unlocks are free for now and will connect to real purchases at launch.
      </div>
    </Modal>
  );
}

function BackupModal({ onClose, onImported }) {
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);

  const exportData = () => {
    const payload = {
      app: "quizzly",
      version: 1,
      exportedAt: new Date().toISOString(),
      data: Object.fromEntries(
        Object.values(K).map((key) => [key, localStorage.getItem(key)]).filter(([, v]) => v !== null)
      ),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `quizzly-backup-${dateKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMsg("Backup downloaded.");
  };

  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.app !== "quizzly" || !parsed.data) {
          setMsg("That file isn't a Quizzly backup.");
          return;
        }
        Object.entries(parsed.data).forEach(([key, value]) => {
          if (typeof value === "string") localStorage.setItem(key, value);
        });
        setMsg("Restored. Reloading…");
        setTimeout(onImported, 700);
      } catch (err) {
        setMsg("Couldn't read that file.");
      }
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Backup & restore" onClose={onClose}>
      <p className="sheet-note">
        Your scores live only on this device. Export a copy before switching phones — free, always.
      </p>
      <button className="btn btn-primary" onClick={exportData}>Export my data</button>
      <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>Restore from file</button>
      <input ref={fileRef} type="file" accept="application/json" onChange={importData} hidden />
      {msg && <div className="sheet-msg">{msg}</div>}
    </Modal>
  );
}

// ---------------------------------------------------------------------
// 7. APP
// ---------------------------------------------------------------------
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem(K.theme) || "light");
  const [palette, setPalette] = useState(() => localStorage.getItem(K.palette) || "honey");
  const [pro, setPro] = useState(() => localStorage.getItem(K.pro) === "1");
  const [owned, setOwned] = useState(() => readJSON(K.owned, []));
  const [stats, setStats] = useState(() => ({ ...EMPTY_STATS, ...readJSON(K.stats, {}) }));
  const [daily, setDaily] = useState(() => readJSON(K.daily, {}));

  const [screen, setScreen] = useState("home");
  const [practice, setPractice] = useState(false);
  const [quiz, setQuiz] = useState(null);
  const [lastRun, setLastRun] = useState(null);
  const [modal, setModal] = useState(null);

  const today = dateKey();
  const puzzleNo = puzzleNumber(today);
  const todayEntry = daily[today];

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(K.theme, theme);
  }, [theme]);

  useEffect(() => {
    const p = PALETTES.find((x) => x.id === palette) || PALETTES[0];
    document.documentElement.style.setProperty("--accent", p.accent);
    document.documentElement.style.setProperty("--accent-2", p.accent2);
    localStorage.setItem(K.palette, palette);
  }, [palette]);

  useEffect(() => writeJSON(K.stats, stats), [stats]);
  useEffect(() => writeJSON(K.daily, daily), [daily]);
  useEffect(() => writeJSON(K.owned, owned), [owned]);

  const startDaily = () => {
    if (todayEntry) {
      setQuiz(buildQuiz(today));
      setLastRun({ results: todayEntry.results, scores: todayEntry.scores });
      setPractice(false);
      setScreen("results");
      return;
    }
    setQuiz(buildQuiz(today));
    setPractice(false);
    setScreen("quiz");
  };

  const startPractice = () => {
    setQuiz(buildQuiz(`practice-${Date.now()}-${Math.random()}`));
    setPractice(true);
    setScreen("quiz");
  };

  const finish = (results, scores) => {
    const total = scores.reduce((a, b) => a + b, 0);
    if (!practice) {
      setDaily((d) => ({ ...d, [today]: { results, scores, score: total } }));
      setStats((s) => recordResult(s, today, total, results));
    }
    setLastRun({ results, scores });
    setScreen("results");
  };

  const pickPalette = (id, unlocked) => {
    if (!unlocked && !owned.includes(id)) setOwned((o) => [...o, id]);
    setPalette(id);
  };

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">Quizzly</div>
        <div className="top-actions">
          <span className="puzzle-no">#{puzzleNo}</span>
          <button
            className="icon-btn"
            onClick={() => setTheme(theme === "light" ? "dark" : "light")}
            aria-label="Toggle theme"
          >
            {theme === "light" ? "🌙" : "☀️"}
          </button>
        </div>
      </header>

      {screen === "home" && (
        <HomeView
          stats={stats}
          todayDone={Boolean(todayEntry)}
          todayScore={todayEntry ? todayEntry.score : 0}
          onPlay={startDaily}
          onPractice={startPractice}
          onStats={() => setModal("stats")}
          onShop={() => setModal("shop")}
          onBackup={() => setModal("backup")}
        />
      )}

      {screen === "quiz" && quiz && (
        <QuizView quiz={quiz} onDone={finish} isPractice={practice} onQuit={() => setScreen("home")} />
      )}

      {screen === "results" && quiz && lastRun && (
        <ResultsView
          quiz={quiz}
          results={lastRun.results}
          scores={lastRun.scores}
          stats={stats}
          isPractice={practice}
          puzzleNo={puzzleNo}
          onHome={() => setScreen("home")}
          onPractice={startPractice}
        />
      )}

      {modal === "stats" && <StatsModal stats={stats} onClose={() => setModal(null)} />}
      {modal === "shop" && (
        <ShopModal owned={owned} palette={palette} pro={pro} onPick={pickPalette} onClose={() => setModal(null)} />
      )}
      {modal === "backup" && (
        <BackupModal onClose={() => setModal(null)} onImported={() => window.location.reload()} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
