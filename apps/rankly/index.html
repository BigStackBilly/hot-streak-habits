<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
// =====================================================================
// RANKLY — put five things in the right order
//
// Three rounds a day. Each round gives five items and a scale; move them
// into the correct order. Scoring rewards partial credit, because
// getting four of five right should not score the same as guessing.
//
// Local-first, no login, no backend, inline Babel so it runs from file://.
// =====================================================================

const { useState, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------
// Round bank. Each entry: [prompt, lowLabel, highLabel, itemsInTrueOrder]
// Items are listed smallest/earliest first; the player orders them the
// same way. Every fact here is a stable, checkable ordering.
// ---------------------------------------------------------------------
const ROUNDS = [
  ["Order these planets by distance from the Sun", "Closest", "Farthest", ["Mercury", "Venus", "Earth", "Mars", "Jupiter"]],
  ["Order these by number of legs", "Fewest", "Most", ["Snake", "Human", "Dog", "Insect", "Spider"]],
  ["Order these units by size", "Smallest", "Largest", ["Millimetre", "Centimetre", "Metre", "Kilometre", "Mile"]],
  ["Order these events in history", "Earliest", "Latest", ["Great Pyramid built", "Roman Empire falls", "Columbus sails", "French Revolution", "Moon landing"]],
  ["Order these by average lifespan", "Shortest", "Longest", ["Mayfly", "Mouse", "Dog", "Human", "Tortoise"]],
  ["Order these countries by land area", "Smallest", "Largest", ["Netherlands", "Japan", "France", "India", "Russia"]],
  ["Order these by boiling point", "Lowest", "Highest", ["Nitrogen", "Ethanol", "Water", "Mercury", "Iron"]],
  ["Order these by typical top speed", "Slowest", "Fastest", ["Sloth", "Human", "Horse", "Cheetah", "Peregrine falcon"]],
  ["Order these musical eras", "Earliest", "Latest", ["Baroque", "Classical", "Romantic", "Jazz age", "Hip hop"]],
  ["Order these by number of sides", "Fewest", "Most", ["Triangle", "Square", "Pentagon", "Hexagon", "Octagon"]],
  ["Order these by height", "Shortest", "Tallest", ["Statue of Liberty", "Big Ben", "Eiffel Tower", "Empire State", "Burj Khalifa"]],
  ["Order these inventions", "Earliest", "Latest", ["Printing press", "Steam engine", "Telephone", "Television", "Smartphone"]],
  ["Order these by water content", "Least", "Most", ["Bread", "Banana", "Apple", "Watermelon", "Cucumber"]],
  ["Order these by distance from Earth", "Nearest", "Farthest", ["Moon", "Venus", "Sun", "Neptune", "Proxima Centauri"]],
  ["Order these by average depth", "Shallowest", "Deepest", ["Swimming pool", "Canal", "Lake", "Sea", "Ocean trench"]],
  ["Order these by population", "Smallest", "Largest", ["Iceland", "Ireland", "Netherlands", "Germany", "China"]],
  ["Order these temperatures", "Coldest", "Hottest", ["Freezer", "Fridge", "Room", "Body", "Boiling water"]],
  ["Order these by weight", "Lightest", "Heaviest", ["Feather", "Apple", "Brick", "Person", "Car"]],
  ["Order these time spans", "Shortest", "Longest", ["Second", "Hour", "Week", "Year", "Decade"]],
  ["Order these by year founded", "Oldest", "Newest", ["Oxford University", "Harvard", "Coca-Cola", "NASA", "SpaceX"]],
  ["Order these instruments by pitch range", "Lowest", "Highest", ["Tuba", "Cello", "Guitar", "Violin", "Piccolo"]],
  ["Order these by cooking time", "Quickest", "Slowest", ["Boiled egg", "Pasta", "Roast chicken", "Beef stew", "Slow-cooked brisket"]],
  ["Order these by number of players per side", "Fewest", "Most", ["Tennis singles", "Basketball", "Ice hockey", "Football", "Rugby union"]],
  ["Order these by typical altitude", "Lowest", "Highest", ["Sea level", "Hill", "Mountain peak", "Passenger jet", "Satellite"]],
  ["Order these by Scoville heat", "Mildest", "Hottest", ["Bell pepper", "Jalapeno", "Cayenne", "Habanero", "Ghost pepper"]],
  ["Order these by data size", "Smallest", "Largest", ["Byte", "Kilobyte", "Megabyte", "Gigabyte", "Terabyte"]],
  ["Order these Olympic events by distance", "Shortest", "Longest", ["100m sprint", "400m", "1500m", "10000m", "Marathon"]],
  ["Order these by age of the material", "Youngest", "Oldest", ["Plastic", "Steel", "Paper", "Bronze", "Stone tools"]],
  ["Order these by average sleep needed", "Least", "Most", ["Giraffe", "Adult human", "Toddler", "Cat", "Koala"]],
  ["Order these by typical price", "Cheapest", "Priciest", ["Coffee", "Cinema ticket", "Video game", "Smartphone", "Small car"]],
];

const ROUNDS_PER_DAY = 3;
const POINTS_PER_ROUND = 400;
const MAX_SCORE = ROUNDS_PER_DAY * POINTS_PER_ROUND;

// ---------------------------------------------------------------------
// Seeded randomness
// ---------------------------------------------------------------------
function hashString(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h;
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

const EPOCH = new Date(2026, 0, 1);
function puzzleNumber(key) {
  const [y, m, d] = key.split("-").map(Number);
  return Math.max(1, Math.round((new Date(y, m - 1, d) - EPOCH) / 86400000) + 1);
}

function buildDay(seedKey) {
  const rand = mulberry32(hashString(seedKey));
  // Pick distinct rounds so a single day never repeats a prompt.
  const pool = ROUNDS.map((_, i) => i);
  for (let i = 0; i < ROUNDS_PER_DAY; i++) {
    const j = i + Math.floor(rand() * (pool.length - i));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, ROUNDS_PER_DAY).map((idx) => {
    const [prompt, low, high, correct] = ROUNDS[idx];
    // Shuffle the presented order, but never hand the player the answer.
    let shown;
    do {
      shown = [...correct];
      for (let i = shown.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [shown[i], shown[j]] = [shown[j], shown[i]];
      }
    } while (shown.every((v, i) => v === correct[i]));
    return { prompt, low, high, correct, shown };
  });
}

// ---------------------------------------------------------------------
// Scoring — partial credit by exact position, so a near-miss still counts.
// ---------------------------------------------------------------------
function scoreRound(order, correct) {
  let right = 0;
  for (let i = 0; i < correct.length; i++) if (order[i] === correct[i]) right++;
  return { right, points: Math.round((right / correct.length) * POINTS_PER_ROUND) };
}

function gradeFor(score) {
  const pct = score / MAX_SCORE;
  if (pct === 1) return { label: "Perfect", emoji: "🏆" };
  if (pct >= 0.8) return { label: "Sharp", emoji: "🌟" };
  if (pct >= 0.6) return { label: "Solid", emoji: "👍" };
  if (pct >= 0.35) return { label: "Warming up", emoji: "🙂" };
  return { label: "Room to grow", emoji: "🌱" };
}

// ---------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------
const K = {
  stats: "rankly:stats", daily: "rankly:daily", theme: "rankly:theme",
  pro: "rankly:pro", palette: "rankly:palette", owned: "rankly:owned",
};

function readJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* non-fatal */ }
}

const EMPTY_STATS = {
  played: 0, totalScore: 0, bestScore: 0, perfect: 0,
  streak: 0, maxStreak: 0, lastPlayed: null, history: [],
};

function recordResult(stats, key, score) {
  const next = { ...stats };
  next.played += 1;
  next.totalScore += score;
  next.bestScore = Math.max(next.bestScore, score);
  if (score === MAX_SCORE) next.perfect += 1;
  const yesterday = dateKey(new Date(Date.now() - 86400000));
  if (next.lastPlayed === yesterday) next.streak += 1;
  else if (next.lastPlayed === key) { /* replay */ }
  else next.streak = 1;
  next.maxStreak = Math.max(next.maxStreak, next.streak);
  next.lastPlayed = key;
  next.history = [...next.history, { date: key, score }].slice(-60);
  return next;
}

const PALETTES = [
  { id: "clay", name: "Clay", free: true, accent: "#c9643f", accent2: "#a8452f" },
  { id: "ocean", name: "Ocean", free: false, accent: "#3f8fc9", accent2: "#2f5da8" },
  { id: "moss", name: "Moss", free: false, accent: "#6a9e4f", accent2: "#3f7a52" },
  { id: "plum", name: "Plum", free: false, accent: "#9a4f8f", accent2: "#6d3570" },
];

// ---------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------
function HomeView({ stats, todayDone, todayScore, onPlay, onPractice, onStats, onShop, onBackup }) {
  const avg = stats.played ? Math.round(stats.totalScore / stats.played) : 0;
  return (
    <div className="view home">
      <div className="hero">
        <div className="hero-mark"><span /><span /><span /></div>
        <h1 className="hero-title">Rankly</h1>
        <p className="hero-sub">Three orderings a day. Same three for everyone.</p>
      </div>

      {stats.streak > 0 && <div className="streak-chip">🔥 {stats.streak} day{stats.streak === 1 ? "" : "s"} in a row</div>}

      {todayDone ? (
        <div className="done-card">
          <div className="done-label">Today's score</div>
          <div className="done-score">{todayScore}<span className="done-max">/{MAX_SCORE}</span></div>
          <button className="btn btn-primary" onClick={onPlay}>See results</button>
          <button className="btn btn-ghost" onClick={onPractice}>Practice set</button>
        </div>
      ) : (
        <div className="cta-stack">
          <button className="btn btn-primary btn-big" onClick={onPlay}>Play today's set</button>
          <button className="btn btn-ghost" onClick={onPractice}>Practice set</button>
        </div>
      )}

      <div className="stat-row">
        <div className="stat-cell"><div className="stat-num">{stats.played}</div><div className="stat-cap">Played</div></div>
        <div className="stat-cell"><div className="stat-num">{stats.bestScore}</div><div className="stat-cap">Best</div></div>
        <div className="stat-cell"><div className="stat-num">{avg}</div><div className="stat-cap">Average</div></div>
      </div>

      <div className="link-row">
        <button className="link-btn" onClick={onStats}>Stats</button>
        <button className="link-btn" onClick={onShop}>Themes</button>
        <button className="link-btn" onClick={onBackup}>Backup</button>
      </div>
    </div>
  );
}

function RoundView({ round, index, total, isPractice, onSubmit, onQuit }) {
  const [order, setOrder] = useState(round.shown);
  const [revealed, setRevealed] = useState(null);
  const busyRef = useRef(false);

  // Reordering is done with explicit up/down controls rather than drag:
  // it is far more reliable on a touch screen and stays accessible.
  const move = (from, to) => {
    if (busyRef.current || to < 0 || to >= order.length) return;
    setOrder((prev) => {
      const next = [...prev];
      const [item] = next.splice(from, 1);
      next.splice(to, 0, item);
      return next;
    });
  };

  const submit = () => {
    if (busyRef.current) return;
    busyRef.current = true;
    const result = scoreRound(order, round.correct);
    setRevealed(result);
    setTimeout(() => onSubmit({ order, ...result }), 2100);
  };

  return (
    <div className="view round">
      <div className="round-top">
        <button className="quit-btn" onClick={onQuit} aria-label="Quit">✕</button>
        <div className="pips">
          {Array.from({ length: total }).map((_, i) => (
            <span key={i} className={"pip" + (i < index ? " done" : "") + (i === index ? " now" : "")} />
          ))}
        </div>
        {isPractice && <div className="practice-tag">Practice</div>}
      </div>

      <div className="prompt-card">
        <div className="round-cap">Round {index + 1} of {total}</div>
        <div className="prompt">{round.prompt}</div>
      </div>

      <div className="scale">
        <span>↑ {round.low}</span>
        <span>{round.high} ↓</span>
      </div>

      <div className="rank-list">
        {order.map((item, i) => {
          const correctHere = revealed && round.correct[i] === item;
          return (
            <div key={item} className={"rank-row" + (revealed ? (correctHere ? " right" : " wrong") : "")}>
              <span className="rank-no">{i + 1}</span>
              <span className="rank-name">{item}</span>
              {revealed ? (
                <span className="rank-mark">{correctHere ? "✓" : "✕"}</span>
              ) : (
                <span className="rank-moves">
                  <button className="mv" onClick={() => move(i, i - 1)} disabled={i === 0} aria-label={`Move ${item} up`}>▲</button>
                  <button className="mv" onClick={() => move(i, i + 1)} disabled={i === order.length - 1} aria-label={`Move ${item} down`}>▼</button>
                </span>
              )}
            </div>
          );
        })}
      </div>

      {revealed ? (
        <div className="reveal">
          <div className="reveal-score">{revealed.right}/{round.correct.length} in place · +{revealed.points}</div>
          <div className="reveal-answer">Correct: {round.correct.join(" → ")}</div>
        </div>
      ) : (
        <button className="btn btn-primary" onClick={submit}>Lock it in</button>
      )}
    </div>
  );
}

function ResultsView({ rounds, results, stats, isPractice, puzzleNo, onHome, onPractice }) {
  const [copied, setCopied] = useState(false);
  const total = results.reduce((a, r) => a + r.points, 0);
  const grade = gradeFor(total);

  const share = () => {
    const grid = results.map((r) => {
      const blocks = "🟩".repeat(r.right) + "⬜".repeat(5 - r.right);
      return blocks;
    }).join("\n");
    const text = [
      `Rankly #${puzzleNo} — ${total}/${MAX_SCORE}`,
      grid,
      stats.streak > 1 ? `🔥 ${stats.streak}` : "",
    ].filter(Boolean).join("\n");
    if (navigator.share) navigator.share({ text }).catch(() => {});
    else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true); setTimeout(() => setCopied(false), 1800);
      });
    }
  };

  return (
    <div className="view results">
      <div className="result-head">
        <div className="grade-emoji">{grade.emoji}</div>
        <div className="grade-label">{grade.label}</div>
        <div className="result-score">{total}<span className="done-max">/{MAX_SCORE}</span></div>
      </div>

      <div className="review">
        {rounds.map((r, i) => (
          <div key={i} className="review-block">
            <div className="review-prompt">{r.prompt}</div>
            <div className="review-line">
              <span className="blocks">{"🟩".repeat(results[i].right)}{"⬜".repeat(5 - results[i].right)}</span>
              <span className="review-pts">+{results[i].points}</span>
            </div>
            <div className="review-answer">{r.correct.join(" → ")}</div>
          </div>
        ))}
      </div>

      {!isPractice && <button className="btn btn-primary" onClick={share}>{copied ? "Copied!" : "Share result"}</button>}
      <button className="btn btn-ghost" onClick={onPractice}>Practice set</button>
      <button className="btn btn-ghost" onClick={onHome}>Home</button>
    </div>
  );
}

// ---------------------------------------------------------------------
// Modals
// ---------------------------------------------------------------------
function Modal({ title, onClose, children }) {
  return (
    <div className="modal" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <h2>{title}</h2>
          <button className="close-btn" onClick={onClose} aria-label="Close">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function StatsModal({ stats, onClose }) {
  const avg = stats.played ? Math.round(stats.totalScore / stats.played) : 0;
  const recent = stats.history.slice(-14);
  const peak = Math.max(1, ...recent.map((h) => h.score));
  return (
    <Modal title="Your stats" onClose={onClose}>
      <div className="stat-grid">
        <div><b>{stats.played}</b><span>Played</span></div>
        <div><b>{stats.bestScore}</b><span>Best</span></div>
        <div><b>{avg}</b><span>Average</span></div>
        <div><b>{stats.perfect}</b><span>Perfect</span></div>
        <div><b>{stats.streak}</b><span>Streak</span></div>
        <div><b>{stats.maxStreak}</b><span>Longest</span></div>
      </div>
      {recent.length > 0 && (
        <>
          <div className="chart-cap">Last {recent.length} sets</div>
          <div className="chart">
            {recent.map((h, i) => (
              <div key={i} className="bar-slot" title={`${h.date}: ${h.score}`}>
                <div className="bar" style={{ height: `${(h.score / peak) * 100}%` }} />
              </div>
            ))}
          </div>
        </>
      )}
    </Modal>
  );
}

function ShopModal({ owned, palette, pro, onPick, onClose }) {
  return (
    <Modal title="Themes" onClose={onClose}>
      <p className="sheet-note">Colour themes only — they never change the rounds, the items, or your score.</p>
      <div className="palette-grid">
        {PALETTES.map((p) => {
          const unlocked = p.free || pro || owned.includes(p.id);
          return (
            <button key={p.id} className={"palette" + (palette === p.id ? " active" : "")} onClick={() => onPick(p.id, unlocked)}>
              <span className="swatch" style={{ background: `linear-gradient(135deg, ${p.accent}, ${p.accent2})` }} />
              <span className="palette-name">{p.name}</span>
              {!unlocked && <span className="lock">🔒</span>}
            </button>
          );
        })}
      </div>
      <div className="testing-note">Testing preview — unlocks are free for now and will connect to real purchases at launch.</div>
    </Modal>
  );
}

function BackupModal({ onClose, onImported }) {
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);

  const exportData = () => {
    const payload = {
      app: "rankly", version: 1, exportedAt: new Date().toISOString(),
      data: Object.fromEntries(Object.values(K).map((k) => [k, localStorage.getItem(k)]).filter(([, v]) => v !== null)),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `rankly-backup-${dateKey()}.json`; a.click();
    URL.revokeObjectURL(url);
    setMsg("Backup downloaded.");
  };

  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.app !== "rankly" || !parsed.data) { setMsg("That file isn't a Rankly backup."); return; }
        Object.entries(parsed.data).forEach(([k, v]) => { if (typeof v === "string") localStorage.setItem(k, v); });
        setMsg("Restored. Reloading…");
        setTimeout(onImported, 700);
      } catch (err) { setMsg("Couldn't read that file."); }
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Backup & restore" onClose={onClose}>
      <p className="sheet-note">Your results live only on this device. Export a copy before switching phones — free, always.</p>
      <button className="btn btn-primary" onClick={exportData}>Export my data</button>
      <button className="btn btn-ghost" onClick={() => fileRef.current.click()}>Restore from file</button>
      <input ref={fileRef} type="file" accept="application/json" onChange={importData} hidden />
      {msg && <div className="sheet-msg">{msg}</div>}
    </Modal>
  );
}

// ---------------------------------------------------------------------
// App
// ---------------------------------------------------------------------
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem(K.theme) || "light");
  const [palette, setPalette] = useState(() => localStorage.getItem(K.palette) || "clay");
  const [pro] = useState(() => localStorage.getItem(K.pro) === "1");
  const [owned, setOwned] = useState(() => readJSON(K.owned, []));
  const [stats, setStats] = useState(() => ({ ...EMPTY_STATS, ...readJSON(K.stats, {}) }));
  const [daily, setDaily] = useState(() => readJSON(K.daily, {}));

  const [screen, setScreen] = useState("home");
  const [practice, setPractice] = useState(false);
  const [rounds, setRounds] = useState(null);
  const [roundIndex, setRoundIndex] = useState(0);
  const [results, setResults] = useState([]);
  const [modal, setModal] = useState(null);

  const today = dateKey();
  const puzzleNo = puzzleNumber(today);
  const todayEntry = daily[today];

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(K.theme, theme);
  }, [theme]);

  useEffect(() => {
    const p = PALETTES.find((x) => x.id === palette) || PALETTES[0];
    document.documentElement.style.setProperty("--accent", p.accent);
    document.documentElement.style.setProperty("--accent-2", p.accent2);
    localStorage.setItem(K.palette, palette);
  }, [palette]);

  useEffect(() => writeJSON(K.stats, stats), [stats]);
  useEffect(() => writeJSON(K.daily, daily), [daily]);
  useEffect(() => writeJSON(K.owned, owned), [owned]);

  const startDaily = () => {
    const day = buildDay(today);
    setRounds(day);
    setPractice(false);
    if (todayEntry) { setResults(todayEntry.results); setScreen("results"); }
    else { setRoundIndex(0); setResults([]); setScreen("round"); }
  };

  const startPractice = () => {
    setRounds(buildDay(`practice-${Date.now()}-${Math.random()}`));
    setPractice(true);
    setRoundIndex(0);
    setResults([]);
    setScreen("round");
  };

  const submitRound = (r) => {
    const next = [...results, r];
    setResults(next);
    if (roundIndex + 1 >= rounds.length) {
      const total = next.reduce((a, x) => a + x.points, 0);
      if (!practice) {
        setDaily((d) => ({ ...d, [today]: { results: next, score: total } }));
        setStats((s) => recordResult(s, today, total));
      }
      setScreen("results");
    } else {
      setRoundIndex(roundIndex + 1);
    }
  };

  const pickPalette = (id, unlocked) => {
    if (!unlocked && !owned.includes(id)) setOwned((o) => [...o, id]);
    setPalette(id);
  };

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">Rankly</div>
        <div className="top-actions">
          <span className="puzzle-no">#{puzzleNo}</span>
          <button className="icon-btn" onClick={() => setTheme(theme === "light" ? "dark" : "light")} aria-label="Toggle theme">
            {theme === "light" ? "🌙" : "☀️"}
          </button>
        </div>
      </header>

      {screen === "home" && (
        <HomeView
          stats={stats}
          todayDone={Boolean(todayEntry)}
          todayScore={todayEntry ? todayEntry.score : 0}
          onPlay={startDaily}
          onPractice={startPractice}
          onStats={() => setModal("stats")}
          onShop={() => setModal("shop")}
          onBackup={() => setModal("backup")}
        />
      )}

      {screen === "round" && rounds && (
        <RoundView
          key={roundIndex}
          round={rounds[roundIndex]}
          index={roundIndex}
          total={rounds.length}
          isPractice={practice}
          onSubmit={submitRound}
          onQuit={() => setScreen("home")}
        />
      )}

      {screen === "results" && rounds && results.length > 0 && (
        <ResultsView
          rounds={rounds} results={results} stats={stats}
          isPractice={practice} puzzleNo={puzzleNo}
          onHome={() => setScreen("home")} onPractice={startPractice}
        />
      )}

      {modal === "stats" && <StatsModal stats={stats} onClose={() => setModal(null)} />}
      {modal === "shop" && <ShopModal owned={owned} palette={palette} pro={pro} onPick={pickPalette} onClose={() => setModal(null)} />}
      {modal === "backup" && <BackupModal onClose={() => setModal(null)} onImported={() => window.location.reload()} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
