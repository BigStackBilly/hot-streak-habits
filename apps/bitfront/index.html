<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bitfront — pixel RTS tower defence</title>
<meta name="theme-color" content="#12101a" />
<meta name="description" content="A pixel-art RTS tower defence: power fields, mineral extractors, marines and a road full of things that want your Command Center." />

<!-- Press Start 2P for the chunky arcade UI, with a monospace fallback so
     the game is still perfectly usable offline / over file://. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />

<!-- PWA plumbing, same as the sibling apps: makes "Add to Home Screen" give
     a real icon, and caches the shell so it runs with no connection. -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bitfront" />
</head>
<body>

<div id="app">

  <!-- ================= TOP BAR: resources and run state ================= -->
  <header id="topbar">
    <div class="brand">
      <span class="logo">BITFRONT</span>
      <span class="mapname">IRONRUN PASS</span>
    </div>

    <div class="stats">
      <div class="stat minerals-stat">
        <span class="stat-label">MINERALS</span>
        <span class="stat-value" id="minerals">0</span>
        <span class="stat-sub" id="income">+0/s</span>
      </div>
      <div class="stat">
        <span class="stat-label">WAVE</span>
        <span class="stat-value" id="wave-label">1 / 20</span>
        <span class="stat-sub" id="phase-label">PREP</span>
      </div>
      <div class="stat">
        <span class="stat-label">COMMAND CENTER</span>
        <span class="stat-value" id="hq-hp">20/20</span>
        <div class="hq-bar"><div class="hq-fill" id="hq-fill"></div></div>
      </div>
      <div class="stat">
        <span class="stat-label">KILLS</span>
        <span class="stat-value" id="kills">0</span>
        <span class="stat-sub" id="best">NO RUNS YET</span>
      </div>
    </div>

    <div class="controls">
      <button id="btn-pause" class="ctl">⏸ PAUSE</button>
      <button id="btn-speed" class="ctl">1×</button>
      <button id="btn-sound" class="ctl">🔊</button>
      <button id="btn-help" class="ctl">?</button>
    </div>
  </header>

  <!-- ===================== THE MAP ===================== -->
  <main id="stage">
    <div id="screen">
      <canvas id="game"></canvas>
      <!-- Advisor channel: short lines from the Command Center, overlaid on
           the bottom-left of the map and expiring on their own. -->
      <div id="comms"></div>
      <div id="banner"></div>
      <div id="overlay">
        <div class="ov-card">
          <h1 id="ov-title">BITFRONT</h1>
          <div id="ov-body"></div>
          <button id="ov-btn">DEPLOY</button>
        </div>
      </div>
    </div>
    <p id="info-line">1-7 to build · right-click to rally marines · H for the field manual</p>
  </main>

  <!-- ============ BOTTOM: build bar + inspector + wave call ============ -->
  <footer id="dock">
    <div id="build-bar"><!-- generated from TOWERS in game.js --></div>

    <div id="side">
      <div id="sel-panel" class="empty">
        <div id="sel-name">NOTHING SELECTED</div>
        <div id="sel-stats"></div>
        <div class="sel-actions">
          <button id="sel-upgrade" class="act">UPGRADE</button>
          <button id="sel-sell" class="act danger">SELL</button>
        </div>
      </div>
      <button id="send-wave">SEND WAVE 1 NOW</button>
      <div id="next-preview">NEXT: GRUNT</div>
    </div>
  </footer>
</div>

<!-- Plain classic scripts in dependency order — no modules, so this all
     works from a bare file:// URL with no server and no build step.
       sprites.js  every pixel of art, generated at load
       data.js     the map and every balance number
       game.js     simulation, rendering, input, HUD -->
<script src="sprites.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script>
// Register the service worker so the game installs and runs offline. Only
// meaningful over http(s) — skipped silently on file://.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
